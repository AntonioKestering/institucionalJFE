name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Pillow and run image conversion (optional)
        run: |
          if [ -f scripts/convert_images_py.py ]; then
            echo "Found scripts/convert_images_py.py — installing Pillow and running conversion"
            python -m pip install --upgrade pip
            pip install pillow
            python scripts/convert_images_py.py
          else
            echo "No scripts/convert_images_py.py found — skipping image conversion."
          fi

      - name: Deploy to `gh-pages` branch using peaceiris
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # Optional: customize committer name/email
          user_name: github-actions
          user_email: github-actions@github.com
